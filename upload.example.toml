# Przyklad konfiguracji uploadu dla scripts/upload_release.py
# Skopiuj do upload.local.toml (plik lokalny, poza repo - patrz .gitignore).
# Silnik nie zna zadnego z tych adresow ani hasel - pochodza wylacznie stad.

# Baza serwisu transfer.sh (opcjonalna, domyslnie https://transfer.whalebone.io).
transfer_base = "https://transfer.whalebone.io"

# Cele mirrora - do kazdego wysylany jest komplet plikow. Obslugiwane: ftp://
# (user:haslo@host:port z opcjonalnym katalogiem docelowym w sciezce).
destinations = [
  "ftp://user:password@host:port/katalog/",
]

# Publiczny URL bazowy pod ktorym serwowane sa wgrane pliki (mapowanie FTP->HTTP).
# Gdy podany, do kazdego celu FTP dogrywany jest self-contained e2_update.sh z
# zaszytym tym URL - jako "e2_update.sh" oraz "u" (do: wget -O - <base>u | sh).
base_url = "http://host/sciezka/"

# Opcjonalnie: dodatkowe pliki dorzucane do mirrora obok przekazanych w wywolaniu.
include_files = []
